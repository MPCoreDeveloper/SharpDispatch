name: .NET CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore SharpDispatch.slnx

      - name: Build
        run: dotnet build SharpDispatch.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test tests/SharpDispatch.Tests/SharpDispatch.Tests.csproj --configuration Release --no-build

